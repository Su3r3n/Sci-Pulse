name: scipulse

networks:
  scipulse:
    driver: bridge

volumes:
  pg_data:
  kafka_data:
  minio_data:
  ch_data:
  prom_data:
  grafana_data:

services:
  # ===========================================================================
  # 1. Postgres (4 databases: registry, iceberg_catalog, harvester, airflow)
  # ===========================================================================
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 512m
    networks: [scipulse]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_admin_dev_pass}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=2GB
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-init:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["core"]
    networks: [scipulse]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_admin_dev_pass}
      REGISTRY_DB: ${REGISTRY_DB:-registry}
      REGISTRY_DB_USER: ${REGISTRY_DB_USER:-registry_app}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:-registry_dev_pass}
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-debezium}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-debezium_dev_pass}
      ICEBERG_DB: ${ICEBERG_DB:-iceberg_catalog}
      ICEBERG_DB_USER: ${ICEBERG_DB_USER:-iceberg}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:-iceberg_dev_pass}
      HARVESTER_DB: ${HARVESTER_DB:-harvester}
      HARVESTER_DB_USER: ${HARVESTER_DB_USER:-harvester_app}
      HARVESTER_DB_PASSWORD: ${HARVESTER_DB_PASSWORD:-harvester_dev_pass}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_dev_pass}
    volumes:
      - ./platform/postgres/init.sh:/opt/pg-init/init.sh:ro
    entrypoint: ["bash", "/opt/pg-init/init.sh"]

  # ===========================================================================
  # 2. Kafka (KRaft, single broker) + Schema Registry
  # ===========================================================================
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 1024m
    networks: [scipulse]
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    profiles: ["core"]
    networks: [scipulse]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./platform/kafka/init-topics.sh:/opt/kafka-init/init-topics.sh:ro
    entrypoint: ["bash", "/opt/kafka-init/init-topics.sh"]

  schema-registry:
    image: ${SCHEMA_REGISTRY_IMAGE:-confluentinc/cp-schema-registry:7.7.1}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 384m
    networks: [scipulse]
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"   # m6: лимит mem_limit 384m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  registry-init:
    image: curlimages/curl:8.10.1
    profiles: ["core"]
    networks: [scipulse]
    depends_on:
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./contracts:/contracts:ro
      - ./scripts/init_registry.sh:/scripts/init_registry.sh:ro
    entrypoint: ["sh", "/scripts/init_registry.sh"]

  # ===========================================================================
  # 3. Registry Service + Debezium Connect
  # ===========================================================================
  registry:
    build:
      context: .
      dockerfile: services/registry-go/Dockerfile
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 64m
    networks: [scipulse]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      pg-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${REGISTRY_DB_USER:-registry_app}:${REGISTRY_DB_PASSWORD:-registry_dev_pass}@postgres:5432/${REGISTRY_DB:-registry}?sslmode=disable
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:-scipulse-registry-dev-key-change-me}
      PORT: "8080"   # m3: сервис читает PORT (не HTTP_ADDR)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  connect:
    # Образ = debezium/connect + jar-ы Confluent Avro converter (B2, Р-2).
    # Dockerfile в platform/debezium/ (владелец coder-1) принимает ARG BASE_IMAGE.
    build:
      context: ./platform/debezium
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${DEBEZIUM_IMAGE:-debezium/connect:2.7.3.Final}
    image: scipulse/debezium-connect:2.7.3-avro
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 768m
    networks: [scipulse]
    ports:
      - "127.0.0.1:8083:8083"
    # /secrets/debezium.properties пишет scipulse-connect-entrypoint.sh из DEBEZIUM_DB_* при старте
    # (R1). Каталог /secrets принадлежит пользователю kafka в образе, монтировать его не нужно.
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: scipulse-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081   # R5: префикс CONNECT_
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # R1: читает entrypoint (set -eu, обе переменные обязательны) и пишет /secrets/debezium.properties.
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-debezium}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-debezium_dev_pass}
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"   # m6: heap под лимит mem_limit 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  connect-init:
    image: curlimages/curl:8.10.1
    profiles: ["core"]
    networks: [scipulse]
    depends_on:
      connect:
        condition: service_healthy
      registry-init:
        condition: service_completed_successfully
    volumes:
      - ./platform/debezium:/debezium:ro
    entrypoint:
      - sh
      - -c
      - |
        curl -sf -X PUT -H "Content-Type: application/json" \
          --data @/debezium/registry.json \
          http://connect:8083/connectors/registry-postgres/config

  # ===========================================================================
  # 4. MinIO + ClickHouse + Spark
  # ===========================================================================
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-10-13T13-34-11Z}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 384m
    networks: [scipulse]
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_pass}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # M7: в образе minio нет curl, поэтому healthcheck убран. Готовность проверяет
    # minio-init через `mc ready` (см. platform/minio/init.sh).

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2024-10-08T09-37-26Z}
    profiles: ["core"]
    networks: [scipulse]
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_pass}
      S3_WAREHOUSE_BUCKET: ${S3_WAREHOUSE_BUCKET:-warehouse}
    volumes:
      - ./platform/minio/init.sh:/opt/minio-init/init.sh:ro
    entrypoint: ["sh", "/opt/minio-init/init.sh"]

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8-alpine}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 1536m
    networks: [scipulse]
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-scipulse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./platform/clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  ch-init:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8-alpine}
    profiles: ["core"]
    networks: [scipulse]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      registry-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_NATIVE_PORT: 9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:-grafana_ro_dev_pass}
      CLICKHOUSE_SPARK_PASSWORD: ${CLICKHOUSE_SPARK_PASSWORD:-spark_writer_dev_pass}
    volumes:
      - ./platform/clickhouse:/opt/clickhouse-init:ro
    entrypoint: ["sh", "/opt/clickhouse-init/init.sh"]

  # Разовые задания Spark (`make demo-slice`). Профиль `spark` (m11) добавляется
  # к `core` явно: `--profile core --profile spark run --rm spark ...`.
  spark:
    build:
      context: ./platform/spark
      dockerfile: Dockerfile
    profiles: ["spark"]
    mem_limit: 2560m
    networks: [scipulse]
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      pg-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ch-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ICEBERG_DB: ${ICEBERG_DB:-iceberg_catalog}
      ICEBERG_DB_USER: ${ICEBERG_DB_USER:-iceberg}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:-iceberg_dev_pass}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_pass}
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-scipulse}
      CLICKHOUSE_SPARK_USER: spark_writer
      CLICKHOUSE_SPARK_PASSWORD: ${CLICKHOUSE_SPARK_PASSWORD:-spark_writer_dev_pass}
    volumes:
      - ./contracts:/opt/spark/contracts:ro
      - ./reference:/opt/spark/reference:ro
      - ./platform/spark:/opt/spark/jobs:ro

  # ===========================================================================
  # 5. Harvester & Loadgen
  # ===========================================================================
  harvester:
    build:
      context: .
      dockerfile: services/harvester-go/Dockerfile
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 128m
    networks: [scipulse]
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      pg-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      registry-init:
        condition: service_completed_successfully
      connect-init:
        condition: service_completed_successfully
    environment:
      # M1: harvester читает HARVESTER_DB_DSN (курсоры, ETag, бюджет живут в Postgres).
      HARVESTER_DB_DSN: postgres://${HARVESTER_DB_USER:-harvester_app}:${HARVESTER_DB_PASSWORD:-harvester_dev_pass}@postgres:5432/${HARVESTER_DB:-harvester}?sslmode=disable
      HARVESTER_METRICS_ADDR: ":8082"   # m3: порт /healthz и /metrics
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
    volumes:
      - ./data/cache:/app/data/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # B1: Dockerfile создаёт coder-1 (services/loadgen-go/Dockerfile). Контекст `.`
  # нужен, потому что модули собираются через корневой go.work.
  loadgen:
    build:
      context: .
      dockerfile: services/loadgen-go/Dockerfile
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 128m
    networks: [scipulse]
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      registry-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      HTTP_ADDR: ":8084"   # m3: loadgen-go читает HTTP_ADDR
      PORT: "8084"         # m3: задано по указанию координатора; loadgen-go PORT не читает (HTTP_ADDR главнее)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # 6. Observability (kafka-exporter, Prometheus, Grafana)
  # ===========================================================================
  kafka-exporter:
    image: ${KAFKA_EXPORTER_IMAGE:-danielqsj/kafka-exporter:v1.8.0}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 64m
    networks: [scipulse]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 384m
    networks: [scipulse]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./platform/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.0}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 256m
    networks: [scipulse]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      ch-init:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:-grafana_ro_dev_pass}
      GF_TELEGRAM_BOT_TOKEN: ${GF_TELEGRAM_BOT_TOKEN:-}
      GF_TELEGRAM_CHAT_ID: ${GF_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./platform/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

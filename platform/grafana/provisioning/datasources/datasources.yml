apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    access: proxy
    jsonData:
      defaultDatabase: scipulse
      port: 9000
      server: clickhouse
      username: grafana_ro
      protocol: native
      tlsSkipVerify: true
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
    editable: false

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: registry
    static_configs:
      - targets: ["registry:8080"]

  - job_name: harvester
    static_configs:
      - targets: ["harvester:8082"]

  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:8084"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

# m7: JMX-экспортёр для Connect (:9404) пока не подключён. Джоба возвращена,
